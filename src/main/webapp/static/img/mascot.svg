<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d2ff"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2470"/><stop offset="1" stop-color="#0b0f3a"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f7cff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <radialGradient id="eye" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#e0f7ff"/><stop offset=".6" stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <ellipse cx="120" cy="222" rx="58" ry="8" fill="#8b5cf6" opacity=".35" filter="url(#soft)"/>
  <!-- antenna -->
  <line x1="120" y1="34" x2="120" y2="54" stroke="#c9d2ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="28" r="9" fill="url(#glow)"/>
  <circle cx="117" cy="25" r="3" fill="#fff" opacity=".8"/>
  <!-- ears -->
  <rect x="34" y="88" width="18" height="40" rx="9" fill="url(#glow)"/>
  <rect x="188" y="88" width="18" height="40" rx="9" fill="url(#glow)"/>
  <!-- head -->
  <rect x="46" y="52" width="148" height="114" rx="52" fill="url(#body)"/>
  <rect x="62" y="70" width="116" height="78" rx="36" fill="url(#face)"/>
  <rect x="70" y="76" width="60" height="10" rx="5" fill="#fff" opacity=".08"/>
  <!-- eyes -->
  <ellipse cx="98" cy="106" rx="11" ry="14" fill="url(#eye)"/>
  <ellipse cx="142" cy="106" rx="11" ry="14" fill="url(#eye)"/>
  <circle cx="101" cy="101" r="3.5" fill="#fff"/>
  <circle cx="145" cy="101" r="3.5" fill="#fff"/>
  <path d="M104 128 q16 12 32 0" stroke="#67e8f9" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="80" cy="126" r="6" fill="#ec4899" opacity=".45"/>
  <circle cx="160" cy="126" r="6" fill="#ec4899" opacity=".45"/>
  <!-- body -->
  <path d="M78 170 q42 -14 84 0 l6 30 q-48 18 -96 0z" fill="url(#body)"/>
  <circle cx="120" cy="186" r="9" fill="url(#glow)"/>
  <!-- arms -->
  <path d="M74 176 q-22 4 -30 -18" stroke="#c9d2ff" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="42" cy="154" r="10" fill="#fff"/>
  <path d="M166 176 q20 6 26 18" stroke="#c9d2ff" stroke-width="12" fill="none" stroke-linecap="round"/>
</svg>

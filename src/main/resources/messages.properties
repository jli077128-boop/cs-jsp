# 国际化资源（struts.custom.i18n.resources=messages），ActionSupport.getText() 和校验 / 类型转换错误都从这里取
# 文件用 \uXXXX 转义保存，MyEclipse / 任意编码下打开都不会乱码；对应中文写在每行上方注释里
# 两次输入的密码不一致
register.confirm.mismatch=\u4e24\u6b21\u8f93\u5165\u7684\u5bc6\u7801\u4e0d\u4e00\u81f4
# 该账号已被注册，换一个试试
register.username.exists=\u8be5\u8d26\u53f7\u5df2\u88ab\u6ce8\u518c\uff0c\u6362\u4e00\u4e2a\u8bd5\u8bd5
# 结束日期不能早于开始日期
ticket.endDate.beforeStart=\u7ed3\u675f\u65e5\u671f\u4e0d\u80fd\u65e9\u4e8e\u5f00\u59cb\u65e5\u671f
# 请至少填写一行问答（问题不为空的行才会保存）
kb.batch.empty=\u8bf7\u81f3\u5c11\u586b\u5199\u4e00\u884c\u95ee\u7b54\uff08\u95ee\u9898\u4e0d\u4e3a\u7a7a\u7684\u884c\u624d\u4f1a\u4fdd\u5b58\uff09
# 类型转换失败的提示：invalid.fieldvalue.属性名（DateConverter 抛出 TypeConversionException 时使用）
# 开始日期格式不正确，应为 yyyy-MM-dd，例如 2026-10-01
invalid.fieldvalue.startDate=\u5f00\u59cb\u65e5\u671f\u683c\u5f0f\u4e0d\u6b63\u786e\uff0c\u5e94\u4e3a yyyy-MM-dd\uff0c\u4f8b\u5982 2026-10-01
# 结束日期格式不正确，应为 yyyy-MM-dd，例如 2026-10-31
invalid.fieldvalue.endDate=\u7ed3\u675f\u65e5\u671f\u683c\u5f0f\u4e0d\u6b63\u786e\uff0c\u5e94\u4e3a yyyy-MM-dd\uff0c\u4f8b\u5982 2026-10-31
# 其它字段类型转换失败时的默认提示
# 字段 “{0}” 的值格式不正确
struts.default.invalid.fieldvalue=\u5b57\u6bb5 \u201c{0}\u201d \u7684\u503c\u683c\u5f0f\u4e0d\u6b63\u786e
# 字段 “{0}” 的值格式不正确
xwork.default.invalid.fieldvalue=\u5b57\u6bb5 \u201c{0}\u201d \u7684\u503c\u683c\u5f0f\u4e0d\u6b63\u786e

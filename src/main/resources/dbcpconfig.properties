# ===== DBCP2 连接池配置（与课堂 02_strutsRegist / 04_strutsConversion 的 dbcpconfig.properties 写法一致）=====
# 由 com.kmu.cs.util.DBUtil 通过 BasicDataSourceFactory.createDataSource(props) 读取
# !!! 把 username / password 改成你自己 MySQL 的账号密码 !!!

# 连接设置
driverClassName=com.mysql.cj.jdbc.Driver
url=jdbc:mysql://localhost:3306/cs_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
username=root
password=123456

# 初始化连接数
initialSize=5
# 最大连接数量
maxTotal=20
# 最大空闲连接
maxIdle=10
# 最小空闲连接
minIdle=2
# 获取连接时最长等待时间（毫秒），超时抛异常
maxWaitMillis=10000

# 取连接时检测连接是否可用（MySQL 8 小时断开问题）
validationQuery=SELECT 1
testOnBorrow=true
defaultAutoCommit=true
